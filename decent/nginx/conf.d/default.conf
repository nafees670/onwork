# hrms_nginx — single entry point for the HRMS app
# Frontend (Next.js) on /, API + Django admin proxied to backend.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    client_max_body_size 50M;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Django admin
    location /admin {
        set $hrms http://hrms_service:8000;
        proxy_pass $hrms;
    }

    location /auth-admin {
        set $hrms http://hrms_service:8000;
        proxy_pass $hrms;
    }

    # Django static & media files
    location /auth-admin/static/ {
        set $hrms http://hrms_service:8000;
        proxy_pass $hrms;
    }

    location /static/ {
        set $hrms http://hrms_service:8000;
        proxy_pass $hrms;
    }

    location /media/ {
        set $hrms http://hrms_service:8000;
        proxy_pass $hrms;
    }

    # HRMS backend API (login, refresh, employees, permissions, audit)
    location /api/ {
        set $hrms http://hrms_service:8000;
        proxy_pass $hrms;
    }

    # HRMS frontend (Next.js — login, employee management UI)
    location / {
        set $frontend http://hrms_frontend:3000;
        proxy_pass $frontend;
    }

    location /health/ {
        return 200 'hrms ok\n';
        add_header Content-Type text/plain;
    }
}