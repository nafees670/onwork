name: hrms

services:
  postgres:
    image: postgres:16
    container_name: hrms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: hrms_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hrms_network
    restart: unless-stopped

  hrms-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hrms_service
    env_file:
      - .env
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - AUTH_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    expose:
      - "8000"
    ports:
      - "8200:8000"
    volumes:
      - ./config:/etc/erp/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hrms_network
    restart: unless-stopped

  hrms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "/api"
    container_name: hrms_frontend
    env_file:
      - .env
    expose:
      - "3000"
    ports:
      - "3015:3000"
    depends_on:
      - hrms-service
    networks:
      - hrms_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hrms_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - hrms-service
      - hrms-frontend
    networks:
      - hrms_network
    restart: unless-stopped

networks:
  hrms_network:
    name: hrms_network

volumes:
  erp_postgres_data:
    name: erp_postgres_data